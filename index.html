<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>MangbinMap</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 100vh; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    const map = L.map('map').setView([13.75, 100.5], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const apiUrl = 'https://rainny-sv.onrender.com/weather-today';

    d3.json(apiUrl).then(data => {
      data.Stations.forEach(station => {
        const lat = parseFloat(station.Latitude);
        const lon = parseFloat(station.Longitude);
        const name = station.StationNameTh;
        const temp = station.Observe.Temp;
        const humidity = station.Observe.RH;
        const rain = station.Observe.Rainfall;

        L.circleMarker([lat, lon], {
          radius: 8,
          fillColor: 'blue',
          color: '#fff',
          weight: 1,
          opacity: 1,
          fillOpacity: 0.7
        }).addTo(map)
          .bindPopup(`<strong>${name}</strong><br>อุณหภูมิ: ${temp}°C<br>ความชื้น: ${humidity}%<br>ฝน: ${rain} มม.`);
      });
    }).catch(error => {
      console.error('เกิดข้อผิดพลาดในการดึงข้อมูล:', error);
    });
  </script>
</body>
</html>
